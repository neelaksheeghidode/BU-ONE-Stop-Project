name: BU-OneStop CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: |
        docker build -t bu-onestop:latest .

    - name: Test Docker Container
      run: |
        docker run -d -p 8080:80 --name test-app bu-onestop:latest
        sleep 3
        curl http://localhost:8080
